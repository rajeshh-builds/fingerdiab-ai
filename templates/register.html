{% extends "base.html" %}

{% block title %}Create Account &bull; FingerDiab AI MedTech{% endblock %}

{% block content %}
<div class="py-16 px-4 sm:px-6 lg:px-8 max-w-sm mx-auto relative">

    <!-- Ambient Pastel Glow behind card -->
    <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-80 h-80 bg-[#FDE8D3]/50 blur-[90px] rounded-full pointer-events-none -z-10"></div>

    <div class="p-8 space-y-6 bg-white/90 border border-[#CFD6C4] rounded-[32px] shadow-soft-card relative overflow-hidden backdrop-blur-xl">
        
        <!-- Header -->
        <div class="space-y-3 text-center">
            <div class="w-12 h-12 rounded-2xl bg-[#FDE8D3] border border-[#F3C3B2]/50 text-[#4B554C] flex items-center justify-center mx-auto shadow-sm">
                <svg class="w-6 h-6 text-[#4B554C]" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M19 7.5v3m0 0v3m0-3h3m-3 0h-3m-2.25-4.125a3.375 3.375 0 11-6.75 0 3.375 3.375 0 016.75 0zM4 19.235v-.11a6.375 6.375 0 0112.75 0v.109A12.318 12.318 0 0110.374 21c-2.331 0-4.512-.645-6.374-1.765z" />
                </svg>
            </div>
            <h1 class="text-xl font-bold text-[#4B554C] font-heading tracking-tight">
                Create Practitioner Account
            </h1>
            <p class="text-xs text-[#657166]">
                Register to initiate biometric screenings and manage patient cohorts.
            </p>
        </div>

        <!-- Form -->
        <form action="{{ url_for('register_page') }}" method="POST" class="space-y-4 text-xs">

            <!-- Full Name -->
            <div class="space-y-1.5">
                <label for="full_name" class="block font-semibold text-[#4B554C]">
                    Full Name
                </label>
                <input type="text" id="full_name" name="full_name" placeholder="Dr. Rajesh Kumar" required
                       class="w-full px-3.5 py-2.5 bg-[#FAF9F6] border border-[#CFD6C4] rounded-xl text-xs text-[#4B554C] placeholder-[#657166]/50 focus:outline-none focus:border-[#99CDD8] focus:ring-2 focus:ring-[#99CDD8]/30 transition">
            </div>

            <!-- Username -->
            <div class="space-y-1.5">
                <label for="username" class="block font-semibold text-[#4B554C]">
                    Username
                </label>
                <input type="text" id="username" name="username" placeholder="rajesh_clinician" required
                       class="w-full px-3.5 py-2.5 bg-[#FAF9F6] border border-[#CFD6C4] rounded-xl text-xs text-[#4B554C] placeholder-[#657166]/50 focus:outline-none focus:border-[#99CDD8] focus:ring-2 focus:ring-[#99CDD8]/30 transition">
            </div>

            <!-- Email -->
            <div class="space-y-1.5">
                <label for="email" class="block font-semibold text-[#4B554C]">
                    Email Address
                </label>
                <input type="email" id="email" name="email" placeholder="rajesh@clinical-ai.org"
                       class="w-full px-3.5 py-2.5 bg-[#FAF9F6] border border-[#CFD6C4] rounded-xl text-xs text-[#4B554C] placeholder-[#657166]/50 focus:outline-none focus:border-[#99CDD8] focus:ring-2 focus:ring-[#99CDD8]/30 transition">
            </div>

            <!-- Password -->
            <div class="space-y-1.5">
                <label for="password" class="block font-semibold text-[#4B554C]">
                    Password
                </label>
                <div class="relative">
                    <input type="password" id="password" name="password" placeholder="••••••••" required
                           class="w-full px-3.5 py-2.5 bg-[#FAF9F6] border border-[#CFD6C4] rounded-xl text-xs text-[#4B554C] placeholder-[#657166]/50 focus:outline-none focus:border-[#99CDD8] focus:ring-2 focus:ring-[#99CDD8]/30 transition pr-9">
                    <button type="button" onclick="togglePasswordVisibility('password', this)" class="absolute right-3 top-2.5 text-[#657166] hover:text-[#4B554C] transition">
                        <svg class="w-4 h-4 eye-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z" /><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /></svg>
                    </button>
                </div>
            </div>

            <!-- Action -->
            <div class="pt-2">
                <button type="submit" class="w-full btn-ink-pill py-3 text-xs tracking-wide shadow-md flex items-center justify-center gap-2">
                    <span>Register Practitioner &amp; Launch</span>
                    <svg class="w-3.5 h-3.5 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5L21 12m0 0l-7.5 7.5M21 12H3" /></svg>
                </button>
            </div>

        </form>

        <!-- Footer link -->
        <div class="pt-4 border-t border-[#CFD6C4] text-center text-xs text-[#657166]">
            Already registered? 
            <a href="{{ url_for('login_page') }}" class="text-[#4B554C] hover:underline font-bold ml-1">Sign in</a>
        </div>

    </div>

</div>

<script>
function togglePasswordVisibility(fieldId, btn) {
    const field = document.getElementById(fieldId);
    if (field.type === 'password') {
        field.type = 'text';
    } else {
        field.type = 'password';
    }
}
</script>
{% endblock %}
